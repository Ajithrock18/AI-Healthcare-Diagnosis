name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose build --no-cache

      - name: List Docker images
        run: docker images

      - name: Test backend build
        run: docker build -t aihealthcare-backend:test ./backend

      - name: Test frontend build
        run: docker build -t aihealthcare-frontend:test ./frontend

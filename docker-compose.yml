services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aihealthcareproject-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - healthcare-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aihealthcareproject-frontend
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - healthcare-network
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: aihealthcareproject-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - healthcare-network
    depends_on:
      - frontend
    restart: unless-stopped

networks:
  healthcare-network:
    driver: bridge
